version: "3.9"

services:
  localstack:
    image: localstack/localstack
    container_name: localstack_service
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3
    volumes:
      - ./localstack-init:/etc/localstack/init
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s

  app:
    build: .
    container_name: my_poll_app
    depends_on:
      localstack:
        condition: service_healthy
    env_file:
      - .env    
    environment:
      - DJANGO_ENV=dev
      - DD_TRACE_ENABLED=false
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python wait_for_db.py &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  localstack_data:
