version: "3.9"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_service
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3,lambda,kinesis,dynamodb,events
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - /c/Users/hp/Desktop/my_poll_project:/app/my_poll_project
      - /c/Users/hp/Desktop/my_poll_project/localstack-init/ready.d:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s

  app:
    build: .
    container_name: my_poll_app
    depends_on:
      localstack:
        condition: service_healthy
    env_file:
      - .env    
    environment:
      - DJANGO_ENV=dev
      - DD_TRACE_ENABLED=false
      - DJANGO_SETTINGS_MODULE=my_poll_project.settings.dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python wait_for_db.py &&
             python manage.py runserver 0.0.0.0:8000"

