version: "3.9"
services:
  # ---------- LocalStack ----------
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_service
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3,lambda,kinesis
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s

  # ---------- Setup for Publisher ----------
  setup_localstack_publisher:
    build: .
    container_name: setup_localstack_publisher_service
    environment:
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      APP_ROLE: PUBLISHER
      DD_TRACE_ENABLED: false
    command: python manage.py setup_localstack
    depends_on:
      localstack:
        condition: service_healthy

  # ---------- Setup for Consumer ----------
  setup_localstack_consumer:
    build: .
    container_name: setup_localstack_consumer_service
    environment:
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      APP_ROLE: CONSUMER
      DD_TRACE_ENABLED: false
    command: python manage.py setup_localstack
    depends_on:
      localstack:
        condition: service_healthy

  # ---------- Publisher App ----------
  publisher:
    build: .
    container_name: my_poll_app_publisher
    environment:
      DJANGO_ENV: local
      APP_ROLE: PUBLISHER
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      DD_TRACE_ENABLED: false
    depends_on:
      setup_localstack_publisher:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "sleep 5 && python wait_for_db.py && python manage.py runserver 0.0.0.0:8000"

  # ---------- Consumer App ----------
  consumer:
    build: .
    container_name: my_poll_app_consumer
    environment:
      DJANGO_ENV: local
      APP_ROLE: CONSUMER
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      DD_TRACE_ENABLED: false
    depends_on:
      setup_localstack_consumer:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    command: >
      sh -c "sleep 5 && python wait_for_db.py && python manage.py runserver 0.0.0.0:8000"
