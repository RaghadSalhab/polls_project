version: "3.9"
services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_service
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3,lambda,kinesis
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 10s

  setup_localstack:
    build: .
    container_name: setup_localstack_service
    environment:
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - DD_TRACE_ENABLED=false
    command: python manage.py setup_localstack
    depends_on:
      localstack:
        condition: service_healthy

  app:
    build: .
    container_name: my_poll_app
    depends_on:
      setup_localstack:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_ENV=local
      - DJANGO_SETTINGS_MODULE=my_poll_project.settings.local
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - DD_TRACE_ENABLED=false
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python wait_for_db.py &&
             python manage.py runserver 0.0.0.0:8000"
